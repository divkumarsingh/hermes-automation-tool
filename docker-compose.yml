services:
  db:
    image: postgres:latest
    container_name: hermes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: hermes_db

    ports:
      - "5432:5432"
    volumes:
      - hermesdb_data:/var/lib/postgressql

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  hermesdb_data:
  redis_data:
